name: seven-blog

services:
  frontend:
    image: "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
    env_file:
      - /app/caixypromise/seven-blog/service/frontend.env
    environment:
      NODE_ENV: production
      CONTENT_SOURCE: file
      CONTENT_ROOT: /content-store/current
      CONTENT_ENV: prod
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - /app/caixypromise/seven-blog/content:/content-store:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/content').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    image: "${BACKEND_IMAGE}@${BACKEND_DIGEST}"
    env_file:
      - /app/caixypromise/seven-blog/service/backend.env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/blog.sqlite
    ports:
      - "127.0.0.1:4100:4000"
    volumes:
      - /app/caixypromise/seven-blog/service/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
